name: Build JFDocWeld Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Versão da release (ex: v1.0.1)"
        required: true
        default: "v1.0.2"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências Python e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter tkinterdnd2 pillow pdf2docx python-docx pypdf moviepy requests pyinstaller

      - name: Compilar executável com PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "JFDocWeld" --icon="jfdocweld.ico" --add-data "jfdocweld.ico;." --add-data "app/main.py;app" --add-data "app/version.txt;app" --hidden-import="fitz" --hidden-import="pdf2docx" --hidden-import="docx" --hidden-import="pypdf" --hidden-import="PIL" --hidden-import="requests" --hidden-import="tkinterdnd2" --hidden-import="moviepy" --hidden-import="proglog" --collect-all="customtkinter" --collect-all="tkinterdnd2" launcher.py

      - name: Gerar instalador com Inno Setup
        run: |
          iscc instalador.iss

      - name: Resolver nome da tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $t = "${{ inputs.tag_name }}"
          } else {
            $t = "${{ github.ref_name }}"
          }
          if (-not $t.StartsWith("v")) { $t = "v$t" }
          "tag_name=$t" >> $env:GITHUB_OUTPUT

      - name: Publicar Release com Setup_JFDocWeld.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: JF DocWeld ${{ steps.tag.outputs.tag_name }}
          files: |
            Output\Setup_JFDocWeld.exe
          generate_release_notes: true
